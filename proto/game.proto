syntax = "proto3";

package game;

// ============================================================
// TinyRPC 游戏协议定义
// ============================================================

// ---- 枚举 ----

// 玩家段位
enum PlayerRank {
    RANK_UNSPECIFIED = 0;  // 未指定
    RANK_BRONZE      = 1;  // 青铜
    RANK_SILVER      = 2;  // 白银
    RANK_GOLD        = 3;  // 黄金
    RANK_PLATINUM    = 4;  // 白金
    RANK_DIAMOND     = 5;  // 钻石
}

// 房间状态
enum RoomStatus {
    ROOM_STATE_UNSPECIFIED = 0;  // 未指定（proto3 默认值，保留）
    ROOM_STATE_IDLE        = 1;  // 空闲
    ROOM_STATE_WAITING     = 2;  // 等待中
    ROOM_STATE_PLAYING     = 3;  // 游戏中
    ROOM_STATE_FINISHED    = 4;  // 结算中
    ROOM_STATE_DESTROYED   = 5;  // 已销毁
}

// 操作错误码（服务端 → 客户端，告知失败原因）
enum ErrorCode {
    ERR_NONE                   = 0;  // 成功
    ERR_ROOM_NOT_FOUND         = 1;  // 房间不存在
    ERR_ROOM_FULL              = 2;  // 房间已满
    ERR_ROOM_NOT_JOINABLE      = 3;  // 房间状态不允许加入
    ERR_PLAYER_ALREADY_IN_ROOM = 4;  // 玩家已在房间中
    ERR_PLAYER_NOT_IN_ROOM     = 5;  // 玩家不在房间中
    ERR_NOT_OWNER              = 6;  // 不是房主
    ERR_WRONG_ROOM_STATE       = 7;  // 房间状态不允许此操作
}

// ---- 基础数据结构 ----

// 玩家信息
message PlayerInfo {
    string player_id   = 1;  // 玩家 ID
    string player_name = 2;  // 玩家名称
    PlayerRank rank    = 3;  // 玩家段位
}

// 房间信息
message RoomInfo {
    string room_id          = 1;  // 房间 ID
    string room_name        = 2;  // 房间名称
    int32  player_count     = 3;  // 当前人数
    int32  max_players      = 4;  // 最大人数
    RoomStatus room_state   = 5;  // 房间状态
    repeated PlayerInfo players = 6;  // 玩家列表
}

// 玩家分数（用于 GameOverNtf）
message PlayerScore {
    string player_id   = 1;
    string player_name = 2;
    int32  score       = 3;  // 得分
    int32  rank        = 4;  // 排名（1 = 第一名）
}

// ---- 登录 ----

// 客户端 → 服务端：使用 token 登录
message LoginReq {
    string token = 1;  // 登录凭证
}

// 服务端 → 客户端：返回玩家信息
message LoginRes {
    bool success            = 1;  // 是否成功
    PlayerInfo player_info  = 2;  // 玩家信息（成功时返回）
    string error_msg        = 3;  // 错误描述（失败时返回）
}

// ---- 房间操作 ----

// 创建房间
message CreateRoomReq {
    string player_id  = 1;  // 房主 ID
    string room_name  = 2;  // 房间名称
    int32  max_players = 3;  // 最大人数（默认 2）
}

message CreateRoomRes {
    bool success      = 1;
    RoomInfo room_info = 2;  // 房间完整信息（成功时返回）
    string error_msg  = 3;
}

// 加入房间
message JoinRoomReq {
    string player_id = 1;  // 玩家 ID
    string room_id   = 2;  // 目标房间 ID
}

message JoinRoomRes {
    bool success      = 1;
    RoomInfo room_info = 2;  // 房间完整信息（成功时返回，含所有玩家）
    string error_msg  = 3;
}

// 离开房间
message LeaveRoomReq {
    string player_id = 1;
    string room_id   = 2;
}

message LeaveRoomRes {
    bool success     = 1;
    string error_msg = 2;
}

// ---- 游戏流程 ----

// 开始游戏（通常由房主发起）
message StartGameReq {
    string room_id   = 1;
    string player_id = 2;  // 发起请求的玩家（服务端校验是否为房主）
}

message StartGameRes {
    bool success     = 1;
    string error_msg = 2;
}

// 游戏结束通知（服务端主动推送，非请求-响应）
message GameOverNtf {
    string room_id              = 1;
    repeated PlayerScore scores = 2;  // 所有玩家的分数和排名
    int32  game_duration_sec    = 3;  // 游戏时长（秒）
}

// ---- 房间内广播 ----

// 房间广播消息（服务端推送，非请求-响应）
// 服务端向房间内所有玩家推送的消息
message RoomBroadcastMsg {
    string room_id   = 1;  // 房间 ID
    string sender_id = 2;  // 发送者 player_id
    string content   = 3;  // 消息内容
    int64  timestamp = 4;  // 发送时间戳（毫秒）
}

// ---- 房间事件通知（服务端主动推送） ----

// 玩家加入通知（服务端 → 房间内所有玩家）
message PlayerJoinNtf {
    string room_id      = 1;  // 房间 ID
    string player_id    = 2;  // 加入的玩家 ID
    int32  player_count = 3;  // 加入后的房间人数
}

// 玩家离开通知（服务端 → 房间内剩余玩家）
message PlayerLeaveNtf {
    string room_id      = 1;  // 房间 ID
    string player_id    = 2;  // 离开的玩家 ID
    int32  player_count = 3;  // 离开后的房间人数
}

// 游戏开始通知（服务端 → 房间内所有玩家）
message GameStartNtf {
    string room_id   = 1;  // 房间 ID
    int64  timestamp = 2;  // 开始时间戳（毫秒）
}

// ---- 以下为序列化对比测试保留 ----

// 简单测试消息 — 字段类型与 TLV Serializer 对齐
message EchoRequest {
    int32  int_val  = 1;
    string str_val  = 2;
    double dbl_val  = 3;
    bool   bool_val = 4;
}
